name: Auto Update Prices

on:
  workflow_dispatch:
  schedule:
    # --- ช่วงเปิดตลาด (เวลาไทย 20:30 - 23:30 น. = UTC 13:30 - 16:30) ---
    - cron: '30 13 * * 1-5'       # 20:30 น. ไทย (จันทร์ - ศุกร์)
    - cron: '0,30 14-16 * * 1-5'  # ทุก 30 นาที ช่วง 21:00 - 23:30 น. ไทย

    # --- ช่วงหลังปิดตลาดแน่ๆ (เวลาไทย 04:30 - 05:30 น. = UTC 21:30 - 22:30 วันก่อนหน้า) ---
    # ตลาด US ปิด 03:00 น. หรือ 04:00 น. ไทย การรันช่วง 04:30 - 05:30 น. ไทย จะได้ราคาปิดที่แน่นอน
    - cron: '30 21 * * 1-5'       # 04:30 น. ไทย (วันอังคาร - เสาร์)
    - cron: '30 22 * * 1-5'       # 05:30 น. ไทย (วันอังคาร - เสาร์)

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python update_prices.py
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }} # 👈 เพิ่มบรรทัดนี้
